<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Studio — Suivi de ma demande</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="lib/studio.css">
<link rel="stylesheet" href="lib/plateau.css">
</head>
<body class="client plateau">
<main>
  <header class="top">
    <h1 data-i18n="trackTitle">Suivi de ma demande</h1>
    <div class="langs" id="langs" role="group" aria-label="Langue / اللغة / Language"></div>
  </header>
  <div id="msg" class="msg" data-i18n="trackLoading">Chargement…</div>
  <section id="card" hidden>
    <p><span data-i18n="doneCode"></span> <strong id="code" dir="ltr"></strong><span id="ref" dir="ltr"></span> — <span id="status" class="status"></span></p>
    <p id="explain" class="desc"></p>
    <p id="refundInfo" class="note" hidden></p>
    <div id="lines" class="totals"></div>
    <div id="pay" class="note" hidden></div>
    <a class="button whatsapp big" id="wa" target="_blank" rel="noopener" hidden data-i18n="writeStudio"></a>
    <p class="mute small" id="when"></p>
    <div id="cancelBox" hidden>
      <button type="button" class="link" id="cancelOpen" data-i18n="cancelOpen"></button>
      <div id="cancelForm" class="note" hidden>
        <p id="cancelWarn"></p>
        <label><span data-i18n="cancelReason"></span><textarea id="cancelReason" rows="2" maxlength="300"></textarea></label>
        <button type="button" class="big danger" id="cancelYes" data-i18n="cancelYes"></button>
        <button type="button" class="big" id="cancelNo" data-i18n="cancelNo"></button>
        <p class="msg bad" id="cancelMsg" role="alert" hidden></p>
      </div>
    </div>
  </section>
  <p class="actions"><a class="button" href="./" data-i18n="newReq"></a></p>
</main>
<script type="module">
  import { t, tr, money, ltr, applyPage } from "./lib/i18n.js";
  applyPage(document.getElementById("langs"));
  document.title = "Studio — " + t("trackTitle");

  const $ = (id) => document.getElementById(id);
  const el = (tag, props = {}, ...kids) => { const e = Object.assign(document.createElement(tag), props); e.append(...kids); return e; };

  try {
    const token = new URLSearchParams(location.search).get("t") || "";
    if (!/^[A-Za-z0-9]{32}$/.test(token)) throw new Error(t("badLink"));
    const { db } = await import("./lib/firebase.js");
    const { doc, getDoc, writeBatch, serverTimestamp } = await import("https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js");
    const { whatsappLink, algiersLabel } = await import("./lib/studio-core.js");
    const [snap, contactSnap] = await Promise.all([getDoc(doc(db, "tracking", token)), getDoc(doc(db, "publicSettings", "contact"))]);
    if (!snap.exists()) throw new Error(t("notFound"));
    const d = snap.data();
    const contact = contactSnap.exists() ? contactSnap.data() : {};
    $("code").textContent = d.code;
    $("ref").textContent = d.ref ? ` · ${d.ref}` : "";
    $("status").textContent = t("s_" + d.status) === "s_" + d.status ? d.status : t("s_" + d.status);
    $("status").className = "status " + d.status;
    const expired = d.status === "pending" && d.holdExpiresAt && d.holdExpiresAt.toMillis() < Date.now();
    // Un message écrit par l'équipe reste tel quel ; sinon, explication dans la langue du client.
    const byClient = d.cancelledBy === "client";
    $("explain").textContent = d.message || (d.status === "cancelled" && byClient ? t("e_cancelledClient") : "") || {
      pending: expired ? t("e_expired") :
        (d.quotePending ? t("e_quote") : t("e_saved") + (d.holdExpiresAt ? t("e_hold", { d: ltr(algiersLabel(d.holdExpiresAt.toMillis())) }) : "")),
      confirmed: t("e_confirmed"),
      cancelled: t("e_cancelled"),
      done: t("e_done"),
    }[d.status] || "";
    const row = (a, b, cls = "") => el("div", { className: "detail " + cls }, el("span", { textContent: a }), el("span", { className: "amt", textContent: b }));
    const rows = d.lines.map((l) => row(tr(l.label), l.price === null ? t("onQuote") : money(l.price)));
    if (d.total !== null && d.total !== undefined) {
      rows.push(row(t("total"), money(d.total), "strong"));
      if (d.deposit) rows.push(row(t("depositShort"), money(d.deposit)), row(t("remainingShort"), money(d.remaining)));
    }
    $("lines").replaceChildren(...rows);
    if (d.status === "pending" && d.deposit) {
      const pay = [contact.depositNote, contact.baridimob && "BaridiMob : " + contact.baridimob, contact.ccp && "CCP : " + contact.ccp].filter(Boolean);
      if (pay.length) { $("pay").textContent = t("payDeposit", { p: money(d.deposit) }) + "\n" + pay.join("\n"); $("pay").hidden = false; }
    }
    if (contact.whatsapp) {
      // Message au studio, en français pour l'équipe.
      $("wa").href = whatsappLink(contact.whatsapp, `Bonjour, ${d.status === "cancelled" && byClient ? "j'ai annulé" : "je vous écris au sujet de"} ma demande n° ${d.code}${d.ref ? ` (${d.ref})` : ""}.\nSuivi : ${location.href}` + (t("clientLang") ? `\nLangue du client : ${t("clientLang")}` : ""));
      $("wa").hidden = false;
    }
    // Annulée après l'acompte (la référence n'existe qu'une fois l'acompte reçu) : où en est le remboursement.
    if (d.status === "cancelled" && (d.ref || d.refunded)) {
      $("refundInfo").textContent = d.refunded ? t("e_refunded", { p: money(d.refunded) }) : t("e_refundWait");
      $("refundInfo").hidden = false;
    }
    // Annulation par le client, avant ou après l'acompte.
    if (d.status === "pending" || d.status === "confirmed") {
      $("cancelBox").hidden = false;
      $("cancelWarn").textContent = d.ref ? t("cancelWarnPaid") : t("cancelWarnPending");
      $("cancelOpen").onclick = () => { $("cancelForm").hidden = false; $("cancelOpen").hidden = true; $("cancelReason").focus(); };
      $("cancelNo").onclick = () => { $("cancelForm").hidden = true; $("cancelOpen").hidden = false; };
      $("cancelYes").onclick = async () => {
        const reason = $("cancelReason").value.trim().slice(0, 300);
        $("cancelYes").disabled = true; $("cancelMsg").hidden = true;
        try {
          const b = writeBatch(db);
          b.update(doc(db, "orders", d.orderId), { status: "cancelled", cancelledBy: "client", cancelReason: reason, cancelledAt: serverTimestamp() });
          b.update(doc(db, "tracking", token), { status: "cancelled", cancelledBy: "client", cancelReason: reason, updatedAt: serverTimestamp() });
          await b.commit();
          location.reload();
        } catch {
          $("cancelMsg").textContent = t("cancelFail"); $("cancelMsg").hidden = false; $("cancelYes").disabled = false;
        }
      };
    }
    $("when").textContent = d.createdAt ? t("sentOn") + ltr(algiersLabel(d.createdAt.toMillis())) : "";
    $("msg").hidden = true; $("card").hidden = false;
  } catch (e) {
    $("msg").textContent = tr(e.message || String(e));
    $("msg").className = "msg bad";
  }
</script>
</body>
</html>
