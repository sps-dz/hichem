<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio — Réserver</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="lib/studio.css">
<link rel="stylesheet" href="lib/simple.css">
</head>
<body class="client simple">
<div class="s-wall" id="sWall" aria-hidden="true"></div>
<header class="s-nav">
  <p class="s-logo" id="studioName">Studio</p>
  <div class="langs" id="langs" role="group" aria-label="Langue / اللغة / Language"></div>
</header>
<button type="button" class="s-caption" id="sCaption" hidden></button>
<button type="button" class="s-fab" id="vFab" data-go="studio"><span class="bulb" aria-hidden="true"></span><span><span data-i18n="vFab"></span><small data-i18n="vFabSub"></small></span></button>
<main id="reserver" class="s-panel">
  <h1 data-i18n="sHello"></h1>
  <p class="lead" data-i18n="intro">Louez le studio à l'heure ou confiez-nous vos photos et vidéos. Le prix s'affiche tout de suite, sans engagement.</p>
  <div class="how">
    <b data-i18n="howTitle"></b>
    <ol>
      <li data-i18n="how1"></li>
      <li data-i18n="how2"></li>
      <li data-i18n="how3"></li>
    </ol>
  </div>
  <p id="provisional" class="note" hidden data-i18n="provisional"></p>

  <div id="loading" class="msg" data-i18n="loading">Chargement des tarifs…</div>

  <div id="shop" hidden>
    <h2 class="steph" data-i18n="chooseService"></h2>
    <nav class="services" role="tablist" id="tabs"></nav>

    <!-- Location du studio -->
    <section data-tab="studio" hidden>
      <h2 data-i18n="studioH"></h2>
      <p class="desc" data-i18n="studioDesc"></p>
      <p class="hint" data-i18n="studioSteps"></p>
      <div class="pickgrid">
        <div>
          <div class="calhead">
            <button type="button" id="sPrev" data-i18n-aria="prevMonth">‹</button>
            <b id="sMonth"></b>
            <button type="button" id="sNext" data-i18n-aria="nextMonth">›</button>
          </div>
          <div class="cal" id="sCal"></div>
          <div class="legend">
            <span><i class="dot free"></i><span data-i18n="legFree"></span></span>
            <span><i class="dot part"></i><span data-i18n="legPart"></span></span>
            <span><i class="dot full"></i><span data-i18n="legFull"></span></span>
          </div>
        </div>
        <div>
          <p class="daytitle" id="sDayTitle"></p>
          <p class="mute small" id="sHours"></p>
          <div class="hours" id="sSlots"></div>
          <p class="msg bad" id="sSlotMsg" role="alert" hidden></p>
          <div class="legend" id="sSlotLegend" hidden>
            <span><i class="dot free"></i><span data-i18n="legFree"></span></span>
            <span><i class="dot sel"></i><span data-i18n="legSel"></span></span>
            <span><i class="dot full"></i><span data-i18n="legBooked"></span></span>
          </div>
          <p class="rangebox" id="sRange" aria-live="polite" hidden></p>
        </div>
      </div>
      <h3 id="sOptTitle" data-i18n="optTitle"></h3>
      <p class="hint" id="sOptHint" data-i18n="optHint"></p>
      <div id="sAddons" class="checks"></div>
      <h3 data-i18n="priceTitle"></h3>
      <div class="pricebox" id="sPrice" aria-live="polite"></div>
      <button class="primary big" id="sAdd" data-i18n="addCart"></button>
    </section>

    <!-- Shooting produit -->
    <section data-tab="product" hidden>
      <h2 data-i18n="productH"></h2>
      <p class="desc" data-i18n="productDesc"></p>
      <div class="grid3">
        <label><span data-i18n="pack"></span><select id="pPack"></select><span class="hint" id="pPackHint"></span></label>
        <label><span data-i18n="extra"></span><input id="pExtra" type="number" inputmode="numeric" min="0" max="500" value="0"><span class="hint" id="pExtraHint"></span></label>
      </div>
      <div id="pAddons" class="checks"></div>
      <h3 data-i18n="priceTitle"></h3>
      <div class="pricebox" id="pPrice" aria-live="polite"></div>
      <button class="primary big" id="pAdd" data-i18n="addCart"></button>
    </section>

    <!-- Vidéo -->
    <section data-tab="video" hidden>
      <h2 data-i18n="videoH"></h2>
      <p class="desc" data-i18n="videoDesc"></p>
      <div class="grid3">
        <label><span data-i18n="videoCount"></span><input id="vReels" type="number" inputmode="numeric" min="1" value="1"><span class="hint" id="vTiers"></span></label>
        <label><span data-i18n="videoFormat"></span><select id="vFormat"></select><span class="hint" data-i18n="formatHint"></span></label>
      </div>
      <div id="vAddons" class="checks"></div>
      <h3 data-i18n="priceTitle"></h3>
      <div class="pricebox" id="vPrice" aria-live="polite"></div>
      <button class="primary big" id="vAdd" data-i18n="addCart"></button>
    </section>

    <!-- Montage -->
    <section data-tab="editing" hidden>
      <h2 data-i18n="editingH"></h2>
      <p class="desc" data-i18n="editingDesc"></p>
      <div class="grid3">
        <label><span data-i18n="editDuration"></span><select id="eTier"></select></label>
        <label><span data-i18n="editRev"></span><input id="eRev" type="number" inputmode="numeric" min="0" max="20" value="0"><span class="hint" id="eRevHint"></span></label>
      </div>
      <div class="checks"><label class="optcard" id="eSubsCard"><input id="eSubs" type="checkbox"><span class="opttext"><span class="optname" id="eSubsLabel"></span></span></label></div>
      <h3 data-i18n="priceTitle"></h3>
      <div class="pricebox" id="ePrice" aria-live="polite"></div>
      <button class="primary big" id="eAdd" data-i18n="addCart"></button>
    </section>

    <!-- Pub -->
    <section data-tab="ad" hidden>
      <h2 data-i18n="adH"></h2>
      <p class="desc" data-i18n="adDesc"></p>
      <label><span data-i18n="adBrief"></span><textarea id="aBrief" rows="4" maxlength="2000" data-i18n-ph="adPh"></textarea></label>
      <button class="primary big" id="aAdd" data-i18n="addCart"></button>
    </section>

    <!-- Panier -->
    <section id="cartBox">
      <h2 class="steph" data-i18n="cartH"></h2>
      <p class="mute" id="cartEmpty" data-i18n="cartEmpty"></p>
      <div id="cartLines"></div>
      <div id="cartTotals" class="totals" hidden></div>

      <div id="contactForm" hidden>
        <h2 class="steph" style="margin-top:20px" data-i18n="contactH"></h2>
        <p class="hint" data-i18n="contactHint"></p>
        <div class="grid3">
          <label><span data-i18n="name"></span><input id="cName" autocomplete="name" maxlength="80"></label>
          <label><span data-i18n="phone"></span><input id="cPhone" type="tel" inputmode="tel" autocomplete="tel" placeholder="0555 12 34 56" dir="ltr"></label>
        </div>
        <label style="margin-top:8px"><span data-i18n="note"></span><textarea id="cNote" rows="2" maxlength="1000" data-i18n-ph="notePh"></textarea></label>
        <p class="hint" id="holdInfo"></p>
        <button class="primary big" id="send" data-i18n="send"></button>
        <p class="hint center" data-i18n="sendHint"></p>
      </div>
    </section>
  </div>

  <!-- Demande envoyée -->
  <section id="done" hidden>
    <h2 data-i18n="doneH"></h2>
    <p><span data-i18n="doneCode"></span> <strong id="dCode" dir="ltr"></strong></p>
    <div id="dSummary" class="totals"></div>
    <div id="dWhatsapp" hidden>
      <p><b data-i18n="doneWaStep"></b></p>
      <a class="button whatsapp big" id="dWaLink" target="_blank" rel="noopener" data-i18n="doneWaBtn"></a>
    </div>
    <div id="dPay" class="note" hidden></div>
    <p class="mute small" data-i18n="doneKeep"></p>
    <div class="copyrow"><input id="dLink" readonly dir="ltr"><button id="dCopy" data-i18n="copy"></button></div>
    <div class="actions"><a class="button" id="dOpen" data-i18n="openTrack"></a><button id="dNew" data-i18n="newReq"></button></div>
  </section>

  <div id="msg" class="msg" role="alert" hidden></div>
</main>

<script type="module">
  import { lang, t, tr, money, duration, ltr, applyPage } from "./lib/i18n.js";
  applyPage(document.getElementById("langs"));
  document.title = "Studio — " + t("pageTitle");

  // ---------- Fond photo et bouton flottant ----------
  const V = await import("./lib/vitrine.js");
  function setLogo(name) { document.getElementById("studioName").textContent = name; }
  function goTo(id) {
    if ([...document.getElementById("tabs").children].some((b) => b.dataset.id === id)) selectTab(id);
    // Le studio : on va droit au calendrier ; les autres services : en haut du panneau.
    const target = id === "studio" && !document.getElementById("shop").hidden ? document.querySelector('section[data-tab="studio"]') : document.getElementById("tabs");
    // Après le changement d'onglet (le calendrier se redessine), sinon le défilement s'arrête en route.
    setTimeout(() => target.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" }), 120);
  }
  document.querySelectorAll("[data-go]").forEach((b) => (b.onclick = () => goTo(b.dataset.go)));
  // Le bouton flottant s'efface quand la réservation du studio est déjà à l'écran.
  new IntersectionObserver(([e]) => document.getElementById("vFab").classList.toggle("away", e.isIntersecting), { threshold: .05 })
    .observe(document.querySelector('section[data-tab="studio"]'));
  V.slideshow(document.getElementById("sWall"), ["hero"]);
  function buildVitrine(enabled) {
    const cap = document.getElementById("sCaption");
    const keys = enabled.filter((id) => id !== "studio");
    // Une photo par service ; la légende dit lequel et l'ouvre au clic.
    V.slideshow(document.getElementById("sWall"), keys.length ? keys : ["hero"], (k) => {
      cap.hidden = k === "hero";
      cap.textContent = t("tab_" + k);
      cap.onclick = () => goTo(k);
    });
    document.getElementById("vFab").hidden = !enabled.includes("studio");
  }

  const { db, trackingUrl } = await import("./lib/firebase.js");
  const { doc, getDoc, getDocs, collection, query, where, writeBatch, serverTimestamp, Timestamp } = await import("https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js");
  const { priceCart, normalizeDzPhone, randomId, shortCode, whatsappLink, clientWhatsappText, buildClientOrder } = await import("./lib/studio-core.js");

  const $ = (id) => document.getElementById(id);
  const el = (tag, props = {}, ...kids) => { const e = Object.assign(document.createElement(tag), props); e.append(...kids); return e; };
  const show = (text, bad = false) => { const m = $("msg"); m.textContent = text; m.className = "msg" + (bad ? " bad" : ""); m.hidden = !text; };
  const errText = (e) => tr(e?.message || String(e));

  let catalog = null;
  let contact = { holdHours: 24 };
  let cart = loadCart();
  let busySlots = new Map(); // date → Set(HHMM) occupées

  function loadCart() { try { return JSON.parse(localStorage.getItem("studio-cart") || "[]"); } catch { return []; } }
  function saveCart() { try { localStorage.setItem("studio-cart", JSON.stringify(cart)); } catch { /* navigation privée */ } }

  const TABS = ["product", "editing", "video", "ad", "studio"]; // ordre d'affichage
  function selectTab(id) {
    for (const b of $("tabs").children) b.setAttribute("aria-selected", String(b.dataset.id === id));
    document.querySelectorAll("section[data-tab]").forEach((s) => (s.hidden = s.dataset.tab !== id));
  }

  const linePrice = (line) => { try { return { ok: true, p: priceCart(catalog, [line], Date.now()).lines[0] }; } catch (e) { return { ok: false, error: errText(e) }; } };
  const priceText = (price) => (price === null ? t("onQuote") : money(price));
  function renderPrice(box, line) {
    const r = linePrice(line);
    box.replaceChildren();
    if (!r.ok) { box.append(el("span", { className: "bad", textContent: r.error })); return false; }
    for (const d of r.p.details) box.append(el("div", { className: "detail" }, el("span", { textContent: tr(d.label) }), el("span", { className: "amt", textContent: money(d.amount) })));
    box.append(el("div", { className: "detail strong" }, el("span", { textContent: t("price") }), el("span", { className: "amt", textContent: priceText(r.p.price) })));
    return true;
  }
  // Options à cocher : une carte par option, avec son prix (fixe ou à l'heure) et sa description.
  function checks(container, addons) {
    container.replaceChildren(...addons.map((a) => {
      const box = el("input", { type: "checkbox", value: a.id });
      const price = "+" + money(a.price) + (a.unit === "hour" ? t("perHour") : "");
      const text = el("span", { className: "opttext" }, el("span", { className: "optname", textContent: a.name }), el("span", { className: "optprice", textContent: price }));
      if (a.description) text.append(el("span", { className: "optdesc", textContent: a.description }));
      const card = el("label", { className: "optcard" }, box, text);
      box.onchange = () => card.classList.toggle("on", box.checked);
      return card;
    }));
  }
  const checked = (container) => [...container.querySelectorAll("input:checked")].map((i) => i.value);

  // ---------- Location studio ----------
  // Calendrier du mois (jours complets en rouge, non cliquables) puis une case
  // par tranche horaire : le client touche l'heure de début puis l'heure de fin.
  const algiersNow = () => new Date(Date.now() + 3600e3); // heure d'Alger (UTC+1), lue en UTC
  const today = () => algiersNow().toISOString().slice(0, 10);
  const hmToMin = (hm) => Number(hm.slice(0, 2)) * 60 + Number(hm.slice(3, 5));
  const minToHm = (m) => String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
  const hhmm = (m) => minToHm(m).replace(":", "");
  const ymd = (y, mo, d) => new Date(Date.UTC(y, mo, d)).toISOString().slice(0, 10);
  const MONTHS = t("months"), WEEKDAYS = t("wd"), WEEKDAYS_LONG = t("wdLong");
  const MONTHS_AHEAD = 6;

  const sel = { date: "", start: null, end: null, waitingEnd: false };
  const minSpan = () => { const st = catalog.studio; return Math.ceil(st.minMinutes / st.stepMinutes) * st.stepMinutes; };
  const slotMsg = (text) => { $("sSlotMsg").textContent = text || ""; $("sSlotMsg").hidden = !text; };
  let calMonth = null; // { y, m }
  const loadedMonths = new Set();

  // Tranches occupées (days/{date}) d'un mois entier, en une seule lecture.
  // Un blocage expiré reste affiché occupé tant que l'équipe ne l'a pas libéré.
  async function loadMonth(y, m) {
    const key = `${y}-${m}`;
    if (loadedMonths.has(key)) return;
    const first = ymd(y, m, 1), last = ymd(y, m + 1, 0);
    const snap = await getDocs(query(collection(db, "days"), where("date", ">=", first), where("date", "<=", last)));
    for (let d = 1; d <= Number(last.slice(8)); d++) busySlots.set(ymd(y, m, d), new Set());
    snap.forEach((s) => busySlots.set(s.id, new Set(Object.keys(s.data().slots || {}))));
    loadedMonths.add(key);
  }

  /** Horaires et tranches du jour ({ m, state: free | busy | past }), ou null si fermé. */
  function dayBlocks(date) {
    const st = catalog.studio;
    const dow = new Date(date + "T12:00:00Z").getUTCDay();
    const hours = st.openingHours[String(dow)];
    if (!hours || st.specialDates.some((s) => s.date === date && s.kind === "closed")) return null;
    const busy = busySlots.get(date) || new Set();
    const now = algiersNow();
    const nowMin = date === today() ? now.getUTCHours() * 60 + now.getUTCMinutes() : date < today() ? Infinity : -1;
    const blocks = [];
    for (let m = hmToMin(hours.open); m + st.stepMinutes <= hmToMin(hours.close); m += st.stepMinutes) {
      blocks.push({ m, state: m <= nowMin ? "past" : busy.has(hhmm(m)) ? "busy" : "free" });
    }
    return { hours, blocks };
  }
  const isFreeRange = (blocks, from, to) => {
    const inRange = blocks.filter((b) => b.m >= from && b.m < to);
    return inRange.length > 0 && inRange.length * catalog.studio.stepMinutes === to - from && inRange.every((b) => b.state === "free");
  };
  /** closed | past | full | part | free */
  function dayStatus(date) {
    if (date < today()) return "past";
    const day = dayBlocks(date);
    if (!day) return "closed";
    const need = minSpan() / catalog.studio.stepMinutes;
    let run = 0, best = 0;
    for (const b of day.blocks) { run = b.state === "free" ? run + 1 : 0; best = Math.max(best, run); }
    // Plus rien de libre aujourd'hui uniquement parce que l'heure est passée : gris, pas rouge.
    if (best < need) return day.blocks.some((b) => b.state === "busy") ? "full" : "past";
    return day.blocks.some((b) => b.state === "busy") ? "part" : "free";
  }

  function studioLine() {
    return { service: "studio", date: sel.date, start: minToHm(sel.start ?? 0), durationMinutes: (sel.end ?? 0) - (sel.start ?? 0), addons: checked($("sAddons")) };
  }

  async function renderCalendar() {
    const { y, m } = calMonth;
    const td = today();
    const idx = (o) => o.y * 12 + o.m;
    const minIdx = Number(td.slice(0, 4)) * 12 + Number(td.slice(5, 7)) - 1;
    $("sMonth").textContent = `${MONTHS[m]} ${y}`;
    $("sPrev").disabled = idx(calMonth) <= minIdx;
    $("sNext").disabled = idx(calMonth) >= minIdx + MONTHS_AHEAD;
    const cal = $("sCal");
    if (!loadedMonths.has(`${y}-${m}`)) {
      cal.replaceChildren(el("p", { className: "mute small calwait", textContent: t("availLoading") }));
      try { await loadMonth(y, m); } catch (e) { cal.replaceChildren(el("p", { className: "bad small calwait", textContent: t("availFail") + errText(e) })); return; }
      if (calMonth.y !== y || calMonth.m !== m) return; // le client a changé de mois entre-temps
    }
    const cells = WEEKDAYS.map((w) => el("span", { className: "calwd", textContent: w }));
    const firstDow = new Date(Date.UTC(y, m, 1)).getUTCDay();
    for (let i = 0; i < firstDow; i++) cells.push(el("span"));
    const days = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
    for (let d = 1; d <= days; d++) {
      const date = ymd(y, m, d);
      const status = dayStatus(date);
      const b = el("button", { type: "button", textContent: String(d), title: t("st_" + status),
        className: `calday ${status}` + (date === sel.date ? " on" : "") + (date === td ? " today" : "") });
      b.disabled = status === "closed" || status === "past" || status === "full";
      b.setAttribute("aria-label", `${d} ${MONTHS[m]} : ${t("st_" + status)}`);
      b.onclick = () => pickDay(date);
      cells.push(b);
    }
    cal.replaceChildren(...cells);
  }

  function pickDay(date) {
    sel.date = date; sel.start = sel.end = null; sel.waitingEnd = false;
    slotMsg("");
    renderCalendar();
    renderSlots();
  }

  function renderSlots() {
    const box = $("sSlots");
    $("sSlotLegend").hidden = !sel.date;
    if (!sel.date) { box.replaceChildren(); $("sDayTitle").textContent = t("chooseDay"); $("sHours").textContent = ""; refreshStudioPrice(); return; }
    const d = new Date(sel.date + "T12:00:00Z");
    $("sDayTitle").textContent = `${WEEKDAYS_LONG[d.getUTCDay()]} ${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]}`;
    const day = dayBlocks(sel.date);
    if (!day) { $("sHours").textContent = t("closedDay"); box.replaceChildren(); refreshStudioPrice(); return; }
    const st = catalog.studio;
    $("sHours").textContent = t("openInfo", { o: ltr(day.hours.open), c: ltr(day.hours.close), m: duration(minSpan()) });
    box.replaceChildren(...day.blocks.map((b) => {
      const chosen = sel.start !== null && b.m >= sel.start && b.m < sel.end;
      const chip = el("button", { type: "button", dir: "ltr", className: `slot ${b.state}` + (chosen ? " on" : ""), textContent: `${minToHm(b.m)} – ${minToHm(b.m + st.stepMinutes)}` });
      chip.disabled = b.state !== "free";
      chip.title = b.state === "busy" ? t("legBooked") : b.state === "past" ? t("pastHour") : "";
      chip.setAttribute("aria-pressed", String(chosen));
      chip.onclick = () => pickBlock(b.m, day.blocks);
      return chip;
    }));
    refreshStudioPrice();
  }

  // 1er toucher : heure de début (la durée minimale est prise d'office) ;
  // 2e toucher : heure de fin (la case touchée est incluse). Toucher avant le
  // début le déplace ; un nouveau toucher après une sélection complète recommence.
  function pickBlock(m, blocks) {
    const st = catalog.studio;
    slotMsg("");
    if (sel.start !== null && sel.waitingEnd) {
      if (m >= sel.start) {
        const end = Math.max(m + st.stepMinutes, sel.start + minSpan());
        if (isFreeRange(blocks, sel.start, end)) { sel.end = end; sel.waitingEnd = false; return renderSlots(); }
        return slotMsg(t("conflictEnd"));
      }
      if (isFreeRange(blocks, m, sel.end)) { sel.start = m; sel.waitingEnd = false; return renderSlots(); }
    }
    const end = m + minSpan();
    if (!isFreeRange(blocks, m, end)) return slotMsg(t("needFree", { d: duration(minSpan()), h: ltr(minToHm(m)) }));
    sel.start = m; sel.end = end; sel.waitingEnd = true;
    renderSlots();
  }

  function refreshStudioPrice() {
    const ready = Boolean(sel.date) && sel.start !== null && sel.end !== null;
    const range = $("sRange");
    range.hidden = !ready;
    if (ready) {
      range.replaceChildren(el("b", { textContent: t("range", { a: ltr(minToHm(sel.start)), b: ltr(minToHm(sel.end)) }) }), ` · ${duration(sel.end - sel.start)}`,
        el("span", { className: "mute small", textContent: sel.waitingEnd ? t("rangeWaitEnd") : t("rangeRestart") }));
    }
    $("sAdd").disabled = !ready || !renderPrice($("sPrice"), studioLine());
    if (!ready) $("sPrice").replaceChildren(el("span", { className: "mute", textContent: sel.date ? t("pickStart") : t("pickDayFirst") }));
  }

  // Recharge les disponibilités (après un conflit) en gardant le jour choisi s'il reste libre.
  async function refreshStarts() {
    loadedMonths.clear(); busySlots.clear();
    sel.start = sel.end = null; sel.waitingEnd = false;
    await renderCalendar();
    if (sel.date && ["closed", "past", "full"].includes(dayStatus(sel.date))) sel.date = "";
    renderCalendar();
    renderSlots();
  }

  function initStudio() {
    const st = catalog.studio;
    const td = today();
    calMonth = { y: Number(td.slice(0, 4)), m: Number(td.slice(5, 7)) - 1 };
    const move = (delta) => { const i = calMonth.y * 12 + calMonth.m + delta; calMonth = { y: Math.floor(i / 12), m: i % 12 }; renderCalendar(); };
    $("sPrev").onclick = () => move(-1);
    $("sNext").onclick = () => move(1);
    checks($("sAddons"), st.addons || []);
    $("sOptTitle").hidden = $("sOptHint").hidden = !(st.addons || []).length;
    $("sAddons").onchange = refreshStudioPrice;
    $("sAdd").onclick = () => addLine(studioLine());
    renderSlots();
    // Premier jour réservable proposé d'office (dans les 31 prochains jours).
    renderCalendar().then(async () => {
      for (let i = 0; i < 31 && !sel.date; i++) {
        const dt = new Date(Date.parse(td + "T12:00:00Z") + i * 864e5);
        try { await loadMonth(dt.getUTCFullYear(), dt.getUTCMonth()); } catch { break; }
        const date = dt.toISOString().slice(0, 10);
        if (["free", "part"].includes(dayStatus(date))) { sel.date = date; calMonth = { y: dt.getUTCFullYear(), m: dt.getUTCMonth() }; }
      }
      renderCalendar();
      renderSlots();
    });
  }

  // ---------- Autres services ----------
  const secLabel = (s) => (s >= 60 ? (lang === "ar" ? `${s / 60} دقيقة` : `${s / 60} min`) : (lang === "ar" ? `${s} ثانية` : `${s} s`));
  function initOthers() {
    const pr = catalog.product, vi = catalog.video, ed = catalog.editing;
    $("pPack").replaceChildren(...pr.packages.map((p) => new Option(`${p.name} — ${money(p.price)}`, p.id)));
    $("pExtraHint").textContent = t("extraHint", { p: money(pr.extraPhotoPrice) });
    checks($("pAddons"), pr.addons || []);
    const pLine = () => ({ service: "product", packageId: $("pPack").value, extraPhotos: Math.max(0, Math.floor(Number($("pExtra").value) || 0)), addons: checked($("pAddons")) });
    const pRefresh = () => {
      const k = pr.packages.find((x) => x.id === $("pPack").value);
      $("pPackHint").textContent = k ? t("packContent", { n: k.products, k: k.photosPerProduct, t: k.products * k.photosPerProduct }) : t("packHint");
      $("pAdd").disabled = !renderPrice($("pPrice"), pLine());
    };
    $("pPack").onchange = $("pExtra").oninput = $("pAddons").onchange = pRefresh;
    $("pAdd").onclick = () => addLine(pLine());
    pRefresh();

    $("vFormat").replaceChildren(...vi.formats.map((f) => new Option(f, f)));
    $("vReels").max = String(vi.maxReels);
    $("vTiers").textContent = vi.volumeTiers.map((x) => t("tiers", { p: x.percent, n: x.minQty })).join(" · ");
    checks($("vAddons"), vi.addons || []);
    const vLine = () => ({ service: "video", reels: Math.floor(Number($("vReels").value) || 0), format: $("vFormat").value, addons: checked($("vAddons")) });
    const vRefresh = () => ($("vAdd").disabled = !renderPrice($("vPrice"), vLine()));
    $("vReels").oninput = $("vFormat").onchange = $("vAddons").onchange = vRefresh;
    $("vAdd").onclick = () => addLine(vLine());
    vRefresh();

    $("eTier").replaceChildren(...ed.durationTiers.map((x) => new Option(t("upTo", { d: secLabel(x.maxSeconds), p: money(x.price) }), String(x.maxSeconds))));
    $("eSubsLabel").textContent = t("subs", { p: money(ed.subtitlesPrice) });
    $("eRevHint").textContent = t("revHint", { n: ed.includedRevisions });
    const eLine = () => ({ service: "editing", videos: [{ seconds: Number($("eTier").value), subtitles: $("eSubs").checked, extraRevisions: Math.max(0, Math.floor(Number($("eRev").value) || 0)) }] });
    const eRefresh = () => { $("eSubsCard").classList.toggle("on", $("eSubs").checked); $("eAdd").disabled = !renderPrice($("ePrice"), eLine()); };
    $("eTier").onchange = $("eSubs").onchange = $("eRev").oninput = eRefresh;
    $("eAdd").onclick = () => addLine(eLine());
    eRefresh();

    $("aAdd").onclick = () => addLine({ service: "ad", brief: $("aBrief").value.trim() });
  }

  // ---------- Panier ----------
  function addLine(line) {
    const r = linePrice(line);
    if (!r.ok) return show(r.error, true);
    try { priceCart(catalog, [...cart, line], Date.now()); } catch (e) { return show(errText(e), true); }
    cart.push(line); saveCart(); show(""); renderCart();
    $("cartBox").scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function cartPricing() {
    if (!cart.length) return null;
    try { return priceCart(catalog, cart, Date.now()); } catch (e) { return { error: errText(e) }; }
  }

  function renderCart() {
    const p = cartPricing();
    $("cartEmpty").hidden = cart.length > 0;
    $("contactForm").hidden = !cart.length;
    $("cartTotals").hidden = !p || !!p.error;
    const box = $("cartLines");
    box.replaceChildren();
    cart.forEach((line, i) => {
      const priced = p && !p.error ? p.lines[i] : null;
      const del = el("button", { className: "link", textContent: t("remove") });
      del.onclick = () => { cart.splice(i, 1); saveCart(); renderCart(); };
      box.append(el("div", { className: "cartline" },
        el("span", { textContent: priced ? tr(priced.label) : t("tab_" + line.service) }),
        el("span", { className: "amt", textContent: priced ? priceText(priced.price) : "" }),
        del));
    });
    if (p && p.error) { show(p.error + t("removeLine"), true); $("send").disabled = true; return; }
    $("send").disabled = !cart.length;
    if (!p) return;
    $("cartTotals").replaceChildren(...totalsRows(p));
    const hasStudio = p.lines.some((l) => l.slotKeys && l.slotKeys.length);
    $("holdInfo").textContent = hasStudio ? t("hold", { h: contact.holdHours }) : "";
  }

  function totalsRows(p) {
    const row = (a, b, cls = "") => el("div", { className: "detail " + cls }, el("span", { textContent: a }), el("span", { className: "amt", textContent: b }));
    if (p.total === null) return [row(t("subtotal"), money(p.subtotal)), row(t("total"), t("totalQuote"), "strong")];
    const out = [row(t("subtotal"), money(p.subtotal))];
    if (p.discount) out.push(row(p.discount.name, money(-p.discount.amount)));
    out.push(row(t("total"), money(p.total), "strong"), row(t("deposit", { p: p.depositPercent }), money(p.deposit)), row(t("remaining"), money(p.remaining)));
    return out;
  }

  // ---------- Envoi ----------
  $("send").onclick = async () => {
    const btn = $("send");
    let phone;
    const name = $("cName").value.trim().replace(/\s+/g, " ");
    if (name.length < 2) { $("cName").focus(); return show(t("needName"), true); }
    try { phone = normalizeDzPhone($("cPhone").value).e164; } catch (e) { $("cPhone").focus(); return show(errText(e), true); }
    const pricing = cartPricing();
    if (!pricing || pricing.error) return show(pricing?.error || t("emptyCart"), true);

    btn.disabled = true; show(t("sending"));
    const orderId = randomId(20), trackingToken = randomId(32);
    const built = buildClientOrder({ orderId, trackingToken, name, phone, note: $("cNote").value.trim(), pricing, holdExpiresAtMs: Date.now() + contact.holdHours * 3600e3 });
    const hold = built.holdExpiresAtMs ? Timestamp.fromMillis(built.holdExpiresAtMs) : null;
    const batch = writeBatch(db);
    batch.set(doc(db, "orders", orderId), { ...built.order, ...(hold ? { holdExpiresAt: hold } : {}), createdAt: serverTimestamp() });
    batch.set(doc(db, "tracking", trackingToken), { ...built.tracking, holdExpiresAt: hold, createdAt: serverTimestamp() });
    for (const [date, hms] of Object.entries(built.slots)) {
      const entries = Object.fromEntries(hms.map((hm) => [hm, { o: orderId, s: "hold", u: hold }]));
      batch.set(doc(db, "days", date), { date, slots: entries, lastOrderId: orderId, updatedAt: serverTimestamp() }, { merge: true });
    }
    try {
      await batch.commit();
    } catch (e) {
      btn.disabled = false;
      busySlots.clear();
      if (e.code === "permission-denied" && built.slotKeys.length) {
        show(t("slotTaken"), true);
        cart = cart.filter((l) => l.service !== "studio"); saveCart(); renderCart(); selectTab("studio"); refreshStarts();
      } else if (e.code === "permission-denied") {
        show(t("ratesChanged"), true);
      } else {
        show(t("sendFail") + errText(e), true);
      }
      return;
    }
    cart = []; saveCart(); show("");
    showDone({ orderId, trackingToken, name, pricing });
  };

  function showDone({ orderId, trackingToken, name, pricing }) {
    const url = trackingUrl(trackingToken);
    $("shop").hidden = true; $("done").hidden = false;
    $("dCode").textContent = shortCode(orderId);
    $("dSummary").replaceChildren(...pricing.lines.map((l) => el("div", { className: "detail" }, el("span", { textContent: tr(l.label) }), el("span", { className: "amt", textContent: priceText(l.price) }))), ...totalsRows(pricing));
    $("dLink").value = url;
    $("dOpen").href = url;
    if (contact.whatsapp) {
      // Message au studio, en français pour l'équipe ; il contient toujours le lien de suivi
      // (sinon pas de bouton : le lien reste affiché plus bas).
      try {
        const text = clientWhatsappText({ code: shortCode(orderId), name, pricing, trackingUrl: url }) + (t("clientLang") ? `\nLangue du client : ${t("clientLang")}` : "");
        $("dWaLink").href = whatsappLink(contact.whatsapp, text);
        $("dWhatsapp").hidden = false;
      } catch (e) { show(errText(e), true); }
    }
    const pay = [contact.depositNote, contact.baridimob && "BaridiMob : " + contact.baridimob, contact.ccp && "CCP : " + contact.ccp].filter(Boolean);
    if (pricing.deposit && pay.length) { $("dPay").textContent = t("payDeposit", { p: money(pricing.deposit) }) + "\n" + pay.join("\n"); $("dPay").hidden = false; }
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
  $("dCopy").onclick = async () => { try { await navigator.clipboard.writeText($("dLink").value); $("dCopy").textContent = t("copied"); } catch { $("dLink").select(); } };
  $("dNew").onclick = () => location.reload();

  // ---------- Démarrage ----------
  try {
    const [c, k] = await Promise.all([getDoc(doc(db, "publicSettings", "catalog")), getDoc(doc(db, "publicSettings", "contact"))]);
    if (!c.exists()) throw new Error(t("notPublished"));
    catalog = c.data().catalog;
    if (k.exists()) contact = { ...contact, ...k.data() };
    if (contact.studioName) { setLogo(contact.studioName); document.title = contact.studioName + " — " + t("pageTitle"); }
    $("provisional").hidden = !catalog.provisional;
    const enabled = TABS.filter((id) => catalog[id].enabled);
    $("tabs").replaceChildren(...enabled.map((id) => {
      const b = el("button", { type: "button", role: "tab", className: "service" }, el("b", { textContent: t("tab_" + id) }), el("span", { textContent: t("tabd_" + id) }));
      b.dataset.id = id;
      b.onclick = () => selectTab(id);
      return b;
    }));
    // Panier gardé d'une visite précédente : on retire ce qui n'est plus valable.
    cart = cart.filter((l) => linePrice(l).ok);
    saveCart();
    initStudio(); initOthers();
    selectTab(enabled[0]);
    buildVitrine(enabled);
    $("loading").hidden = true; $("shop").hidden = false;
    renderCart();
  } catch (e) {
    $("loading").textContent = errText(e);
    $("loading").className = "msg bad";
  }
</script>
</body>
</html>
