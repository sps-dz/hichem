# Lance tous les tests à chaque envoi sur GitHub, y compris les tests des règles
# contre le vrai émulateur Firebase (Java). Aucun accès au projet Firebase réel.
name: Tests studio
on:
  push:
    paths: ["studio/**", ".github/workflows/studio-tests.yml"]
  pull_request:
    paths: ["studio/**", ".github/workflows/studio-tests.yml"]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Fonctions — installation
        run: npm ci
        working-directory: studio/functions
      - name: Fonctions — tests (anti-chevauchement, rôles, audit, argent)
        run: npm test
        working-directory: studio/functions
      - name: Règles — installation
        run: npm ci && npm i -g firebase-tools@14.27.0
        working-directory: studio/tests/rules
      - name: Règles Firestore et Storage — tests sur l'émulateur
        run: npm run test:emulator
        working-directory: studio/tests/rules
